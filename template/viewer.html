  // ── Chat ──────────────────────────────────────────────────────────────────
  // The viewer stays a read-only document unless `./kb chat` is running: without the local
  // runtime there is nothing to talk to, so the view explains how to start it instead of
  // pretending to be live. The channel list belongs to the runtime, not to this page — only the
  // server may decide which folder an agent runs in, so the viewer renders what it is told.
  const CHAT_API = (path, params) => {
    const u = new URL(path, location.origin);
    for (const [k, v] of Object.entries(params || {})) u.searchParams.set(k, v);
    if (window.KB_CHAT && window.KB_CHAT.token) u.searchParams.set('t', window.KB_CHAT.token);
    return u.toString();
  };
  const chatChannels = () => chatState.channels;
  // Every assistant is summonable in every room — that is what makes a project channel more than
  // a second inbox. The roster comes from the base, the summoning is a `@name` in the message.
  function chatRoster() {
    return D.articles
      .filter(a => /^assistants\/assistant-[^/]+\.md$/.test(a.path))
      .map(a => ({ agent: a.slug.replace(/^assistant-/, ''),
                   name: a.title.split(/\s+[—–-]\s+/)[0] || a.title, desc: a.summary }))
      .sort((x, y) => x.name.localeCompare(y.name));
  }
  // Deliberately small: enough structure to read an answer (paragraphs, code, emphasis),
  // no HTML from the model ever reaching the DOM unescaped.
  function chatMd(src) {
    const parts = String(src || '').split(/```/);
    return parts.map((chunk, i) => {
      if (i % 2) return '<pre>' + escapeHtml(chunk.replace(/^[a-zA-Z0-9+-]*\n/, '')) + '</pre>';
      return escapeHtml(chunk)
        .replace(/`([^`\n]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
        .replace(/\n/g, '<br>');
    }).join('');
  }
  const chatState = { channel: 'base', channels: [], messages: [], busy: false, source: null };

  // A roster of single-word names collapses to one letter each — Apelles, Argos, Ariadna and Atlas
  // all become "A". Two letters helps, but a real team still collides (Hefajstos, Helbert, Hermes,
  // Hestia), so colour carries the rest: a hue derived from the whole name, stable across reloads.
  function chatHue(name) {
    let h = 0;
    for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }
  function chatAvatar(name) {
    const s = String(name || '').trim();
    const words = s.split(/[-_. ]+/).filter(Boolean);
    const raw = words.length > 1 ? words.slice(0, 2).map(w => w[0]).join('') : s.slice(0, 2);
    return '<span class="av" style="background:hsl(' + chatHue(s) + ' 58% 47%)">'
      + escapeHtml(raw.toUpperCase()) + '</span>';
  }

  async function chatLoadChannels() {
    try { chatState.channels = await (await fetch(CHAT_API('/api/channels'))).json(); }
    catch { chatState.channels = [{ id: 'base', name: 'Base', kind: 'base', desc: 'The whole knowledge base' }]; }
    return chatState.channels;
  }

  function chatRenderLog() {
    const log = document.getElementById('chat-log');
    if (!log) return;
    const chan = chatChannels().find(c => c.id === chatState.channel) || { name: 'Base' };
    const named = Object.fromEntries(chatRoster().map(r => [r.agent, r.name]));
    log.innerHTML = chatState.messages.map(m => {
      // A reply is signed by whoever was summoned; only an unaddressed one belongs to the room.
      const who = m.role === 'user' ? 'You' : (m.agent ? (named[m.agent] || m.agent) : chan.name);
      const cls = 'msg' + (m.role === 'user' ? ' me' : '') + (m.error ? ' err' : '');
      const tools = (m.tools || []).length
        ? '<div class="tools">' + m.tools.map(t => '<span>' + escapeHtml(t) + '</span>').join('') + '</div>' : '';
      return '<div class="' + cls + '">' + chatAvatar(who) + '<div class="bd">'
        + '<div class="who">' + escapeHtml(who) + '</div>'
        + '<div class="tx">' + (m.text ? chatMd(m.text) : '<i style="opacity:.5">…</i>') + tools + '</div>'
        + '</div></div>';
    }).join('') || '<div style="color:var(--muted);margin:auto;text-align:center">No messages yet — say something.</div>';
    log.scrollTop = log.scrollHeight;
  }

  function chatSetBusy(on) {
    chatState.busy = on;
    const btn = document.getElementById('chat-send');
    const typing = document.getElementById('chat-typing');
    if (btn) { btn.disabled = on; btn.textContent = on ? 'Working…' : 'Send'; }
    if (typing) typing.style.display = on ? '' : 'none';
  }

  async function chatOpen(channelId) {
    chatState.channel = channelId;
    if (chatState.source) { chatState.source.close(); chatState.source = null; }
    chatState.messages = [];
    chatSetBusy(false);
    document.querySelectorAll('.chan').forEach(e => e.classList.toggle('on', e.dataset.chan === channelId));
    const chan = chatChannels().find(c => c.id === channelId);
    const head = document.getElementById('chat-title');
    if (head) {
      // Which folder the turn will run in is the one fact worth showing at all times — in a
      // project room the agent edits real files, and that should never be a surprise.
      // The tail of the path is the part that identifies the folder; the full path is one hover away.
      const tail = chan && chan.path ? chan.path.split('/').filter(Boolean).slice(-2).join('/') : '';
      const where = chan && chan.inBase === false && chan.path
        ? '<span class="chip cwd" title="Agents run in ' + escapeHtml(chan.path) + ' — the base comes along">…/'
          + escapeHtml(tail) + '</span>' : '';
      head.innerHTML = '<b>' + escapeHtml(chan ? chan.name : channelId) + '</b>'
        + '<small>' + escapeHtml((chan && chan.kind === 'project' ? '' : (chan && chan.desc) || '')) + '</small>'
        + where
        + (chan && chan.kind === 'custom' ? '<button id="chat-drop" title="Remove this channel">Remove</button>' : '');
      const drop = document.getElementById('chat-drop');
      if (drop) drop.onclick = () => chatRemoveChannel(chan);
    }
    chatRenderLog();
    try {
      const r = await fetch(CHAT_API('/api/threads', { channel: channelId }));
      const t = await r.json();
      chatState.messages = (t.messages || []).map(m => ({ role: m.role, text: m.text, agent: m.agent || '' }));
    } catch { /* an empty thread is a fine starting point */ }
    chatRenderLog();
  }

  async function chatRemoveChannel(chan) {
    if (!chan || !confirm('Remove the channel "' + chan.name + '"? The folder is untouched; the transcript goes.')) return;
    try {
      const r = await fetch(CHAT_API('/api/channels', { id: chan.id }), { method: 'DELETE' });
      if (!r.ok) throw new Error((await r.json()).error || 'HTTP ' + r.status);
      await chatLoadChannels();
      location.hash = 'chat';
      showChat('');
    } catch (err) { toast(String(err.message || err)); }
  }

  async function chatCreateChannel(name, path, agent) {
    const r = await fetch(CHAT_API('/api/channels'), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name, path, agent }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    await chatLoadChannels();
    return j;
  }

  async function chatSend(text) {
    if (!text.trim() || chatState.busy) return;
    chatState.messages.push({ role: 'user', text });
    const reply = { role: 'assistant', text: '', tools: [] };
    chatState.messages.push(reply);
    chatRenderLog();
    chatSetBusy(true);
    let runId;
    try {
      const r = await fetch(CHAT_API('/api/send'), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ channel: chatState.channel, text }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      runId = j.runId;
      reply.agent = j.agent || '';       // the runtime decides who was addressed; the log follows it
      chatRenderLog();
    } catch (err) {
      reply.text = String(err.message || err); reply.error = true;
      chatSetBusy(false); chatRenderLog(); return;
    }
    const src = new EventSource(CHAT_API('/api/events', { run: runId }));
    chatState.source = src;
    src.onmessage = (e) => {
      let ev; try { ev = JSON.parse(e.data); } catch { return; }
      // Each assistant event is its own turn of the agentic loop — a thought, a tool, a conclusion.
      // Concatenated raw they run into each other mid-sentence, so they are joined as paragraphs.
      if (ev.type === 'text') reply.text += (reply.text && !/\n$/.test(reply.text) ? '\n\n' : '') + ev.text;
      else if (ev.type === 'tool') { if (!reply.tools.includes(ev.name)) reply.tools.push(ev.name); }
      else if (ev.type === 'error') { reply.text += (reply.text ? '\n\n' : '') + ev.message; reply.error = true; }
      else if (ev.type === 'done') { src.close(); chatState.source = null; chatSetBusy(false); }
      chatRenderLog();
    };
    src.onerror = () => { src.close(); chatState.source = null; chatSetBusy(false); };
  }

  function chatViewError(err) {
    document.getElementById('main').className = '';
    document.getElementById('content').innerHTML =
      '<article><h1>⚠ Chat error</h1><div class="meta"><span>· the rest of the app is fine</span></div>'
      + '<pre>' + escapeHtml(String((err && err.stack) || err)) + '</pre></article>';
  }

  const CHAT_GROUPS = [
    { kind: 'base', label: 'Base' },
    { kind: 'agent', label: 'Assistants' },
    { kind: 'project', label: 'Projects' },
    { kind: 'custom', label: 'Yours' },
  ];

  async function showChat(channelId) {
    const main = document.getElementById('main');
    const c = document.getElementById('content');
    document.querySelectorAll('.item').forEach(e => e.classList.toggle('active', !!e.dataset.chat));
    if (!window.KB_CHAT) {
      main.classList.remove('chat-mode');
      c.innerHTML = '<article><h1>💬 Chat</h1>'
        + '<div class="meta"><span class="chip">offline</span><span>· the viewer is a file, not an app — yet</span></div>'
        + '<div class="chat-off"><p>Chat needs the local runtime: it runs Claude Code inside this base, '
        + 'so every skill, assistant and connector you have in the terminal answers here too.</p>'
        + '<p>Start it from the base folder:</p><pre><code>./kb chat</code></pre>'
        + '<p>That reindexes, starts the runtime on <code>127.0.0.1</code> and opens this viewer at the '
        + 'URL it prints. The address carries a one-time token — nothing on the machine can talk to the '
        + 'runtime without it.</p></div></article>';
      return;
    }
    main.classList.add('chat-mode');
    const chans = chatState.channels.length ? chatState.channels : await chatLoadChannels();
    const roster = chatRoster();
    let side = '';
    for (const g of CHAT_GROUPS) {
      const rows = chans.filter(ch => (ch.kind || 'custom') === g.kind);
      if (!rows.length && g.kind !== 'custom') continue;
      side += '<h3>' + g.label + '</h3>';
      side += rows.map(ch => '<div class="chan" data-chan="' + escapeHtml(ch.id) + '" title="'
          + escapeHtml(ch.path || '') + '">' + chatAvatar(ch.name)
          + '<span class="nm"><b>' + escapeHtml(ch.name) + '</b></span>'
          + (ch.inBase === false ? '<span class="badge" title="Runs in its own folder">▲</span>' : '')
          + '</div>').join('');
      if (g.kind === 'custom') side += '<button class="chan-new" id="chan-new">+ New channel</button>';
    }
    c.innerHTML = '<div class="chat">'
      + '<div class="chat-side"><div class="chat-chan">' + side + '</div>'
      + '<div class="chat-status" id="chat-status"></div></div>'
      + '<div class="chat-main">'
      + '<div class="chat-head" id="chat-title"></div>'
      + '<div class="chat-log" id="chat-log"></div>'
      + '<div class="typing" id="chat-typing" style="display:none"><i></i><i></i><i></i> thinking…</div>'
      + '<form class="chat-form" id="chat-form">'
      + '<div class="summon" id="chat-summon" style="display:none"></div>'
      + '<textarea id="chat-input" placeholder="Ask, or give the assistant a job… (@ to summon someone)" rows="2"></textarea>'
      + '<div class="row">'
      + (roster.length ? '<button type="button" class="ghost" id="chat-at" title="Summon an assistant">@</button>' : '')
      + '<span class="hint">Enter to send · Shift+Enter for a new line · this writes to disk</span>'
      + '<button type="submit" id="chat-send">Send</button></div>'
      + '</form></div></div>';

    c.querySelectorAll('.chan').forEach(el => {
      el.onclick = () => { location.hash = 'chat:' + encodeURIComponent(el.dataset.chan); };
    });
    const newBtn = document.getElementById('chan-new');
    if (newBtn) newBtn.onclick = chatNewChannelPrompt;

    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    form.onsubmit = (e) => { e.preventDefault(); const v = input.value; input.value = ''; chatSummonHide(); chatSend(v); };
    input.onkeydown = (e) => {
      if (chatSummonKey(e, input)) return;
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    };
    input.oninput = () => chatSummonSync(input, roster);
    const atBtn = document.getElementById('chat-at');
    if (atBtn) atBtn.onclick = () => {
      input.value += (input.value && !/\s$/.test(input.value) ? ' ' : '') + '@';
      input.focus(); chatSummonSync(input, roster);
    };

    chatOpen(channelId && chans.some(x => x.id === channelId) ? channelId : chans[0].id);
    chatStatus();
    input.focus();
  }

  // Who pays and what the agent is allowed to do are the two facts a chat window should never
  // make you guess — they decide what a careless sentence can cost.
  async function chatStatus() {
    const el = document.getElementById('chat-status');
    if (!el) return;
    try {
      const s = await (await fetch(CHAT_API('/api/ping'))).json();
      const pay = s.billing === 'api' ? 'metered API key' : 'your Claude subscription';
      el.innerHTML = '<span title="Which account pays for a turn">' + escapeHtml(pay) + '</span>'
        + '<span title="What an agent may do without asking">' + escapeHtml(s.permissionMode) + '</span>'
        + (s.keyInEnv && s.billing !== 'api'
            ? '<span class="warn" title="An API key is in the environment but is withheld from turns">key withheld</span>' : '');
    } catch { el.textContent = ''; }
  }

  // ── summoning ─────────────────────────────────────────────────────────────
  // Typing `@` in any room opens the roster. The message goes out as written — the base's mention
  // layer does the routing — so this is a typeahead, not a dispatcher.
  let summonIdx = 0;
  const summonEl = () => document.getElementById('chat-summon');
  function chatSummonHide() { const el = summonEl(); if (el) { el.style.display = 'none'; el.innerHTML = ''; } }
  function chatSummonMatches(input, roster) {
    const upto = input.value.slice(0, input.selectionStart ?? input.value.length);
    const m = upto.match(/(?:^|\s)@([a-z0-9-]*)$/i);
    if (!m) return null;
    const q = m[1].toLowerCase();
    return roster.filter(r => !q || r.agent.startsWith(q) || r.name.toLowerCase().startsWith(q)).slice(0, 8);
  }
  function chatSummonSync(input, roster) {
    const el = summonEl();
    if (!el) return;
    const hits = chatSummonMatches(input, roster);
    if (!hits || !hits.length) return chatSummonHide();
    summonIdx = Math.min(summonIdx, hits.length - 1);
    el.style.display = '';
    el.innerHTML = hits.map((r, i) => '<button type="button" class="sm' + (i === summonIdx ? ' on' : '')
      + '" data-agent="' + escapeHtml(r.agent) + '"><b>@' + escapeHtml(r.agent) + '</b>'
      + '<span>' + escapeHtml(r.name) + '</span></button>').join('');
    el.querySelectorAll('.sm').forEach(btn => {
      btn.onclick = () => chatSummonPick(input, btn.dataset.agent);
    });
  }
  function chatSummonPick(input, agent) {
    const pos = input.selectionStart ?? input.value.length;
    const head = input.value.slice(0, pos).replace(/@([a-z0-9-]*)$/i, '@' + agent + ' ');
    input.value = head + input.value.slice(pos);
    input.focus();
    input.setSelectionRange(head.length, head.length);
    chatSummonHide();
  }
  function chatSummonKey(e, input) {
    const el = summonEl();
    if (!el || el.style.display === 'none') return false;
    const btns = [...el.querySelectorAll('.sm')];
    if (!btns.length) return false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      summonIdx = (summonIdx + (e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length;
      btns.forEach((b, i) => b.classList.toggle('on', i === summonIdx));
      return true;
    }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault(); chatSummonPick(input, btns[summonIdx].dataset.agent); return true;
    }
    if (e.key === 'Escape') { e.preventDefault(); chatSummonHide(); return true; }
    return false;
  }

  // Making a room should not require remembering a path. Claude Code already knows every folder
  // you have worked in, so the picker offers those first and keeps typing one out as the fallback.
  async function chatNewChannelPrompt() {
    let found = [];
    try { found = await (await fetch(CHAT_API('/api/folders'))).json(); } catch { /* offer typing */ }
    const free = found.filter(f => !f.used);
    const c = document.getElementById('content');
    const panel = document.createElement('div');
    panel.className = 'pick-back';
    panel.innerHTML = '<div class="pick"><h3>New channel</h3>'
      + '<p>Agents in this room work in the folder you choose — editing real files — with the '
      + 'knowledge base attached either way.</p>'
      + (free.length
          ? '<div class="pick-list">' + free.map(f =>
              '<button type="button" class="pk" data-path="' + escapeHtml(f.path) + '" data-name="'
              + escapeHtml(f.name) + '"><b>' + escapeHtml(f.name) + '</b><span>'
              + escapeHtml(f.path.replace(/^\/Users\/[^/]+/, '~')) + '</span></button>').join('')
            + '</div>'
          : '<p class="pick-none">Claude Code has no other folders on record yet — type one below.</p>')
      + '<div class="pick-own"><input id="pick-path" placeholder="…or a folder path, e.g. ~/code/thing">'
      + '<button type="button" id="pick-go">Add</button></div>'
      + '<button type="button" class="pick-x" id="pick-close">Cancel</button></div>';
    c.appendChild(panel);

    const close = () => panel.remove();
    panel.onclick = (e) => { if (e.target === panel) close(); };
    document.getElementById('pick-close').onclick = close;
    const make = async (name, path) => {
      try {
        const chan = await chatCreateChannel(name, path, '');
        close();
        location.hash = 'chat:' + encodeURIComponent(chan.id);
        showChat(chan.id).catch(chatViewError);
        toast('Channel "' + chan.name + '" → ' + chan.path);
      } catch (err) { toast(String(err.message || err)); }
    };
    panel.querySelectorAll('.pk').forEach(b => {
      b.onclick = () => make(b.dataset.name, b.dataset.path);
    });
    const own = document.getElementById('pick-path');
    const go = () => {
      const v = own.value.trim();
      if (v) make(v.split('/').filter(Boolean).pop() || v, v);
    };
    document.getElementById('pick-go').onclick = go;
    own.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  }

  function route() {
    const raw = location.hash.slice(1);
    if (!raw) return;
    const main = document.getElementById('main');
    // Unconditional cleanup — a view that crashed mid-render must never poison the next one
    // (a stuck map-mode leaves padding:0 + overflow:hidden on every later view).
    if (raw !== 'board') main.classList.remove('board-mode');
    if (raw !== 'map') { if (mapStop) { mapStop(); mapStop = null; } main.classList.remove('map-mode'); }
    if (raw !== 'chat' && !raw.startsWith('chat:')) {
      main.classList.remove('chat-mode');
      // Leaving the view must also drop the stream, or a background turn keeps painting into a
      // log that is no longer on screen.
      if (chatState.source) { chatState.source.close(); chatState.source = null; }
    }
    try {
      // showChat is the one async view (it asks the runtime for its channels), so its failures
      // need the same "fail loud, not blank" treatment the sync views get from the catch below.
      if (raw === 'chat') showChat('').catch(chatViewError);
      else if (raw.startsWith('chat:')) showChat(decodeURIComponent(raw.slice(5))).catch(chatViewError);
      else if (raw === 'projects') showProjects();
      else if (raw.startsWith('project:')) showProject(decodeURIComponent(raw.slice(8)));
      else if (raw === 'board') showBoard();
      else if (raw === 'settings') showSettings();
      else if (raw === 'map') showMap();
      else if (raw.startsWith('brief:')) showBrief(decodeURIComponent(raw.slice(6)));
      else show(decodeURIComponent(raw));
    } catch (err) {
      // Fail loud, not blank: drop any half-applied layout mode and show what broke.
      main.className = '';
      if (mapStop) { try { mapStop(); } catch (e) {} mapStop = null; }
      document.getElementById('content').innerHTML =
        '<article><h1>⚠ View error</h1>'
        + '<div class="meta"><span class="chip">' + escapeHtml(raw) + '</span><span>· this view crashed — the rest of the app is fine</span></div>'
        + '<pre>' + escapeHtml(String((err && err.stack) || err)) + '</pre></article>';
    }
  }

  document.getElementById('search').addEventListener('input', e => buildTree(e.target.value));
  window.addEventListener('hashchange', route);

  // Pixel-art skin — opt-in toggle, remembered across sessions (chrome only; article body stays readable)
  const pixBtn = document.getElementById('pixel-toggle');
  function applyPixel(on) {
    document.documentElement.setAttribute('data-pixel', on ? 'on' : 'off');
    pixBtn.classList.toggle('on', on);
    pixBtn.title = on ? 'Pixel-art mode: on' : 'Pixel-art mode: off';
    try { localStorage.setItem('kb-pixel', on ? '1' : '0'); } catch (e) {}
  }
  applyPixel((() => { try { return localStorage.getItem('kb-pixel') === '1'; } catch (e) { return false; } })());
  pixBtn.onclick = () => {
    applyPixel(document.documentElement.getAttribute('data-pixel') !== 'on');
    route();   // re-render the current view — views render pixel-specific variants
  };

  buildTree('');
  // The channel list lives in the runtime, so the sidebar can only count them once it has asked.
  if (window.KB_CHAT) chatLoadChannels().then(() => buildTree(document.getElementById('search').value));
  if (location.hash) route();
  else if (D.articles[0]) location.hash = D.articles[0].slug;
})();
</script>
</body>
</html>
