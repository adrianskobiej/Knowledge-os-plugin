<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: block <base> hijack, plugins/embeds and form exfil (no forms/objects are used). -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Knowledge base</title>
<script src="kb-data.js"></script>
<style>
  :root {
    --bg:#f6f7f9; --panel:#ffffff; --ink:#171a21; --muted:#6b7280;
    --line:rgba(23,26,33,.09); --accent:#4f6df5; --accent-soft:rgba(79,109,245,.10);
    --glass:rgba(255,255,255,.78); --broken:#d1242f; --chip:#eef0f4;
    --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
    --shadow-sm:0 1px 2px rgba(15,18,25,.05);
    --shadow-md:0 10px 30px rgba(15,18,25,.13);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0f13; --panel:#16171c; --ink:#e8eaee; --muted:#9199a6;
            --line:rgba(255,255,255,.075); --accent:#8b9dff; --accent-soft:rgba(139,157,255,.14);
            --glass:rgba(22,23,28,.74); --broken:#ff7b72; --chip:#21232b;
            --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
            --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow-md:0 12px 36px rgba(0,0,0,.55); }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); display:flex; height:100vh; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--chip); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--muted); }
  #side { width:302px; flex-shrink:0; border-right:1px solid var(--line);
          background:var(--panel); display:flex; flex-direction:column; }
  #brand { padding:20px 18px 16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  #brand > div { flex:1; min-width:0; }
  #brand b { font-size:16px; letter-spacing:-.01em; }
  #brand span { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
  #side-toggle, #side-open, #pixel-toggle { border:1px solid var(--line); background:transparent; color:var(--muted);
    border-radius:9px; width:30px; height:30px; cursor:pointer; font-size:14px; line-height:1;
    transition:background .12s, color .12s; flex-shrink:0; }
  #side-toggle:hover, #side-open:hover, #pixel-toggle:hover { background:var(--chip); color:var(--ink); }
  #side-open { position:fixed; top:14px; left:14px; z-index:30; display:none;
    background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:var(--shadow-sm); }
  body.side-collapsed #side { display:none; }
  body.side-collapsed #side-open { display:block; }
  body.side-collapsed .map-bar { left:58px; max-width:calc(100% - 72px); }
  #search { margin:14px 16px 10px; padding:10px 14px; border:1px solid var(--line); border-radius:11px;
            background:var(--bg); color:var(--ink); font-size:13.5px; transition:border-color .15s, box-shadow .15s; }
  #search:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #tree { overflow:auto; padding:6px 16px 28px; flex:1; }
  .cat { font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
         margin:20px 13px 8px; font-weight:600; }
  .item { padding:9px 13px; border-radius:10px; cursor:pointer; font-size:13.5px; margin:3px 0;
          transition:background .12s; }
  .item:hover { background:var(--chip); }
  .item.active { background:var(--accent-soft); color:var(--accent); }
  .item small { display:block; color:var(--muted); font-size:11.5px; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:11px;
         vertical-align:1px; flex-shrink:0; }
  .item.active small { color:var(--accent); opacity:.72; }
  #main { flex:1; overflow:auto; padding:52px 64px 100px; }
  @media (max-width:900px){ #main { padding:36px 28px 80px; } }
  #main .wrap { max-width:780px; margin:0 auto; }
  .meta { color:var(--muted); font-size:12.5px; margin:-4px 0 38px; display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .chip { background:var(--chip); padding:2.5px 10px; border-radius:20px; font-size:11.5px; }
  .chip.auth { background:transparent; border:1px solid var(--line); color:var(--muted); }
  .status-draft { color:var(--warn); }
  article h1 { font-size:27px; margin:0 0 10px; letter-spacing:-.015em; }
  article h2 { font-size:19.5px; margin:44px 0 14px; border-bottom:1px solid var(--line); padding-bottom:8px; letter-spacing:-.01em; }
  article h3 { font-size:16px; margin:24px 0 8px; }
  article a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px; }
  article code { background:var(--chip); padding:1px 6px; border-radius:6px; font-size:.87em; }
  article pre { background:var(--chip); padding:14px 16px; border-radius:12px; overflow:auto; }
  article pre code { background:none; padding:0; }
  article blockquote { border-left:3px solid var(--accent); margin:0; padding:2px 16px; color:var(--muted);
                       background:var(--accent-soft); border-radius:0 10px 10px 0; }
  article table { border-collapse:collapse; margin:14px 0; font-size:.9em; display:block; overflow-x:auto; }
  article th, article td { border:1px solid var(--line); padding:7px 12px; text-align:left; vertical-align:top; }
  article th { background:var(--chip); font-weight:600; }
  /* Task board — modern kanban (4 fixed columns, wide layout) */
  #main.board-mode .wrap { max-width:1360px; }
  .board { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:18px; align-items:start; margin-top:4px; }
  @media (max-width:1100px) { .board { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width:640px)  { .board { grid-template-columns:1fr; } }
  .bcol { min-width:0; background:var(--panel); border:1px solid var(--line);
          border-radius:14px; padding:14px; box-shadow:var(--shadow-sm); border-top:3px solid var(--bcol,var(--accent)); }

  .bhead { display:flex; align-items:center; gap:7px; margin:0 2px 13px; font-size:12px;
           text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .bdot { width:8px; height:8px; border-radius:50%; background:var(--bcol,var(--accent)); }
  .bcount { margin-left:auto; background:var(--chip); border-radius:12px; padding:0 8px; font-size:11px; }
  /* Board toolbar — assignee filter + sort switch (state kept in localStorage['kb-board']).
     .fbtn rides on .mbtn so hover/press and the pixel-mode skin apply unchanged. */
  .bbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:2px 0 14px; }
  .bbar .blab { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:0 2px; }
  .bbar .bsep { width:1px; height:16px; background:var(--line); margin:0 5px; }
  .bbar .fbtn { border-radius:14px; padding:3px 11px; font-size:12px; font-family:inherit; }
  .fbtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  /* Assignee dropdown — a searchable list instead of one chip per person (scales with many assignees). */
  .bdrop { position:relative; }
  .bdrop-panel { position:absolute; top:calc(100% + 6px); left:0; z-index:60; min-width:240px; max-height:320px;
                 background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-md);
                 padding:8px; display:flex; flex-direction:column; gap:6px; }
  .bdrop-panel[hidden] { display:none; }
  .bdrop-search { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px;
                  padding:6px 10px; font-size:12.5px; font-family:inherit; }
  .bdrop-search:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .bdrop-list { overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .bdrop-list button { display:flex; align-items:center; gap:8px; border:0; background:transparent; color:var(--ink);
                       font:inherit; font-size:12.5px; padding:6px 9px; border-radius:8px; cursor:pointer; text-align:left; }
  .bdrop-list button:hover { background:var(--chip); }
  .bdrop-list button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .bdrop-list .bcnt { margin-left:auto; color:var(--muted); font-size:11px; }
  .bdrop-list button.on .bcnt { color:inherit; }
  .bcard { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:11px 13px;
           margin-bottom:10px; cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s; }
  .bcard:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .bcard .btitle { font-size:13.5px; line-height:1.45; }
  .btags { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
  .btag { background:var(--chip); border-radius:14px; padding:1px 8px; font-size:10.5px; color:var(--muted); }
  .btag.av { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  
  .btag.due-over { background:transparent; border:1px solid var(--danger); color:var(--danger); }
  /* Priority colours — P1 urgent (red), P2 (amber), P3 (blue) */

  .bcard.overdue { border-color:var(--danger); }
  
  /* Subtasks (task trees) — nested plan on the epic card + progress */
  .bcard.bepic { border-left:3px solid var(--accent); }
  .bprog { display:flex; align-items:center; gap:8px; margin-top:9px; font-size:11px; color:var(--muted); }
  .bprog .bar { flex:1; height:5px; border-radius:4px; background:var(--chip); overflow:hidden; }
  .bprog .bar i { display:block; height:100%; background:var(--ok); border-radius:4px; }

  .bsubs { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .bsub { display:flex; align-items:center; gap:7px; font-size:12px; padding:3px 7px; border-radius:8px;
          background:var(--panel); border:1px solid var(--line); }
  .bsub:hover { border-color:var(--accent); }
  .bsub .num { color:var(--muted); font-size:10px; min-width:13px; text-align:right; }
  .bsub .sdot { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--muted); }

  .bsub .sttl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  
  /* Task detail — the plan (ordered subtasks with the people assigned) */
  .plan { margin-top:26px; }
  .plan h3 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
             display:flex; align-items:center; gap:12px; margin:0 0 10px; }
  .plan h3 .bprog { margin:0; flex:0 1 240px; }
  .step { display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--line);
          border-left:3px solid var(--sc,var(--muted)); border-radius:12px; margin:7px 0; background:var(--panel);
          cursor:pointer; transition:border-color .12s, transform .12s; }
  .step:hover { border-color:var(--accent); transform:translateX(2px); }

  .step .num { width:23px; height:23px; border-radius:50%; background:var(--chip); color:var(--muted);
               display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; font-weight:600; }
  .step .sttl { flex:1; min-width:0; font-size:13.5px; }
  
  .step .btag.st { text-transform:uppercase; letter-spacing:.04em; font-size:9.5px; }

  .parent-link { margin:16px 0 2px; font-size:12.5px; color:var(--muted); }
  .parent-link a { color:var(--accent); }
  /* ⏳ "Waiting on you" — human-gated steps that are your turn now */
  .waitlane { border:1px solid var(--warn); background:transparent; border-radius:14px; padding:10px 14px; margin:0 0 16px; }
  .wl-head { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--warn);
             text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .wl-head .bcount { margin-left:0; }
  .wl-items { display:flex; flex-wrap:wrap; gap:8px; }
  .wl-item { display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line);
             border-radius:10px; padding:7px 11px; cursor:pointer; font-size:13px; transition:border-color .12s; }
  .wl-item:hover { border-color:var(--warn); }

  .bempty { color:var(--muted); font-size:12.5px; display:block; text-align:center;
            border:1px dashed var(--line); border-radius:10px; padding:14px 10px; opacity:.85; }
  
  .backlinks { margin-top:48px; padding-top:18px; border-top:1px solid var(--line); }
  .backlinks h4 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 8px; }
  .backlinks a { display:inline-block; margin:0 8px 6px 0; color:var(--accent); }
  #empty { color:var(--muted); text-align:center; margin-top:90px; }
  /* Map view (whiteboard-style graph of the whole base) */
  #main.map-mode { padding:0; overflow:hidden; }
  #main.map-mode .wrap { max-width:none; margin:0; height:100%; }
  #map-wrap { position:relative; height:100%;
              background:radial-gradient(1100px 640px at 52% 36%, var(--accent-soft), transparent 68%), var(--bg); }
  #map-canvas { display:block; width:100%; height:100%; cursor:grab; }
  #map-canvas.dragging { cursor:grabbing; }
  .map-bar { position:absolute; top:14px; left:14px; display:flex; gap:7px; align-items:center;
             background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(1.35); backdrop-filter:blur(18px) saturate(1.35);
             border:1px solid var(--line); border-radius:14px;
             padding:8px 11px; box-shadow:var(--shadow-md); flex-wrap:wrap; max-width:calc(100% - 28px); }
  .map-bar input[type=text] { border:1px solid var(--line); background:var(--bg); color:var(--ink);
             border-radius:9px; padding:6px 11px; font-size:13px; width:172px; transition:border-color .15s, box-shadow .15s; }
  .map-bar input[type=text]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .mbtn { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:9px;
          padding:5.5px 11px; font-size:13px; cursor:pointer; transition:background .12s, border-color .12s; }
  .mbtn:hover { background:var(--chip); border-color:var(--accent); }
  .mbtn:active { transform:scale(.97); }
  
  #map-stats { font-size:11.5px; color:var(--muted); padding-left:2px; }
  #map-legend { position:absolute; bottom:16px; left:14px; display:flex; gap:6px; flex-wrap:wrap; max-width:72%; }

  /* Map filter bar — dropdown facets (bottom-left): zones/clusters visibility + entity focus.
     Picking an entity lights up its connections; Reset clears every selection. */
  #map-legend { align-items:center; }
  .mdd { position:relative; }
  .mdd-btn { display:flex; align-items:center; gap:6px; background:var(--glass);
             -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
             border:1px solid var(--line); box-shadow:var(--shadow-sm); color:var(--ink);
             border-radius:20px; padding:4px 12px; font-size:12px; cursor:pointer; user-select:none;
             max-width:210px; white-space:nowrap; transition:border-color .12s, background .12s; }
  .mdd-btn:hover { border-color:var(--accent); }
  .mdd-btn.on { border-color:var(--accent); background:var(--accent-soft); }
  .mdd-btn .car { font-size:8.5px; color:var(--muted); }
  .mdd-btn .bx { overflow:hidden; text-overflow:ellipsis; }
  .mdd-panel { position:absolute; bottom:calc(100% + 8px); left:0; min-width:225px; max-width:320px;
               max-height:295px; overflow-y:auto; background:var(--glass);
               -webkit-backdrop-filter:blur(18px) saturate(1.35); backdrop-filter:blur(18px) saturate(1.35);
               border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-md);
               padding:5px; display:none; z-index:6; }
  .mdd.open .mdd-panel { display:block; }
  .mdd.open .mdd-btn { border-color:var(--accent); }
  .mdd-item { display:flex; align-items:center; gap:7px; padding:5.5px 9px; border-radius:8px;
              font-size:12.5px; cursor:pointer; user-select:none; }
  .mdd-item:hover { background:var(--chip); }
  .mdd-item.sel { background:var(--accent-soft); }
  .mdd-item.off { opacity:.35; }
  .mdd-item i { width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }
  .mdd-item .tx { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mdd-item .cnt { margin-left:auto; color:var(--muted); font-size:11px; padding-left:8px; flex:none; }
  #map-tip { position:absolute; pointer-events:none; background:var(--glass);
             -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3);
             border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:12.5px;
             max-width:290px; display:none; box-shadow:var(--shadow-md); z-index:5; }
  #map-tip b { display:block; font-size:13px; }
  #map-tip small { color:var(--muted); }
  /* Settings — switches, stat cards, zone rows */
  .setcard { background:var(--panel); border:1px solid var(--line); border-radius:14px;
             padding:5px 20px; margin:14px 0 30px; box-shadow:var(--shadow-sm); }
  .setrow { display:flex; align-items:center; gap:15px; padding:14px 2px; border-bottom:1px solid var(--line); }
  .setrow:last-child { border-bottom:none; }
  .setrow .ico { width:36px; height:36px; border-radius:10px; background:var(--accent-soft);
                 display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .setrow .txt { flex:1; min-width:0; }
  .setrow .txt b { font-size:14px; display:block; }
  .setrow .txt small { color:var(--muted); font-size:12px; }
  .sw { width:44px; height:25px; border-radius:15px; background:var(--chip); position:relative;
        cursor:pointer; transition:background .18s, border-color .18s; border:1px solid var(--line); flex-shrink:0; }
  .sw i { position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%;
          background:#fff; transition:left .18s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .sw.on { background:var(--accent); border-color:var(--accent); }
  .sw.on i { left:21px; }
  .sw.unset { opacity:.55; border-style:dashed; }
  .sw:hover { border-color:var(--accent); }
  .statgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(128px, 1fr)); gap:12px; margin:18px 0 8px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-sm); }
  .stat b { font-size:21px; display:block; letter-spacing:-.01em; }
  .stat small { color:var(--muted); font-size:11.5px; }
  .zrow { display:flex; align-items:center; gap:11px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .zrow:last-child { border-bottom:none; }
  .zrow .zg { width:20px; text-align:center; font-style:normal; }
  .zrow .zname { min-width:110px; }
  .zrow .zbar { flex:1; height:5px; border-radius:4px; background:var(--chip); overflow:hidden; }
  .zrow .zbar i { display:block; height:100%; border-radius:4px; }
  .zrow .zn { min-width:34px; text-align:right; color:var(--muted); font-size:12px; }

   /* 10 roadmap stages = 5×2 */

  .lvchip { font-size:10.5px; background:var(--chip); color:var(--muted); border-radius:10px; padding:1px 8px; letter-spacing:.03em; }

  .st { font-size:11px; border-radius:12px; padding:2px 9px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .st.active { background:rgba(22,163,74,.14); color:var(--ok); }

  #toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(14px);
           background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
           border:1px solid var(--line); border-radius:12px; padding:10px 16px; font-size:13px;
           box-shadow:var(--shadow-md); opacity:0; pointer-events:none;
           transition:opacity .22s, transform .22s; z-index:40; max-width:88vw; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  /* Narrow screens: sidebar collapses to a top strip so content (incl. the map) keeps room. */
  @media (max-width: 720px) {
    body { flex-direction: column; }
    #side { width:100%; max-height:38vh; border-right:none; border-bottom:1px solid var(--line); }
    #main { padding:24px 18px 60px; }
    #main.map-mode { padding:0; }
    .map-bar input[type=text] { width:110px; }
    #map-legend { max-width:calc(100% - 24px); }
  }

  /* ===== Projects (📁) — list + per-project detail (task history, version, links) ===== */
  .wrap { --pc:#8b7cf6; }   /* projects accent (classic); greyscaled in pixel mode */
  .proj-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin:18px 0 6px; }
  .proj-card { border:1px solid var(--line); border-top:3px solid var(--pc,var(--accent)); border-radius:14px;
               padding:13px 15px; background:var(--panel); box-shadow:var(--shadow-sm); cursor:pointer;
               display:flex; flex-direction:column; gap:8px; transition:transform .12s,box-shadow .12s,border-color .12s; }
  .proj-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--accent); }
  .proj-top { display:flex; align-items:center; gap:8px; }
  .proj-top b { font-size:14.5px; letter-spacing:-.01em; flex:1; min-width:0; }
  .proj-ver { font-size:11px; font-weight:700; background:var(--pc,var(--accent)); color:#fff;
              border-radius:8px; padding:1px 8px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* repo-linked version states: amber = internal version ahead of the GitHub release (unreleased/
     unpushed work), * suffix = uncommitted changes in the working tree */
  .proj-ver.dev { background:var(--warn,#d97706); }
  .chip.vwarn { color:var(--warn,#d97706); font-weight:600; }
  .proj-sum { color:var(--muted); font-size:12.5px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2;
              -webkit-box-orient:vertical; overflow:hidden; }
  .proj-foot { display:flex; align-items:center; gap:7px; margin-top:auto; flex-wrap:wrap; }
  .pchip { display:inline-flex; align-items:center; gap:5px; background:var(--chip); color:var(--muted);
           border-radius:12px; padding:2px 9px; font-size:11.5px; }
  .pchip.big { font-size:13px; padding:6px 12px; }
  .pchip.big b { color:var(--ink); font-weight:600; } .pchip.big small { color:var(--muted); }
  .proj-hero { display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin:2px 0 4px; }
  .proj-hero h1 { margin:0; }
  .proj-link { display:inline-flex; align-items:center; gap:6px; text-decoration:none; border:1px solid var(--line);
               border-radius:9px; padding:6px 12px; font-size:12.5px; color:var(--accent); }
  .proj-link:hover { border-color:var(--accent); background:var(--accent-soft); }
  .proj-ags-list { display:flex; flex-direction:row; flex-wrap:wrap; gap:7px; }
  .proj-tasks { display:flex; flex-direction:column; gap:7px; }
  .proj-sec { margin-top:28px; }
  .proj-sec > h2 { font-size:15px; border:none; padding:0; margin:0 0 12px; display:flex; align-items:center; gap:9px; }
  .changelog { border-left:2px solid var(--line); margin-left:5px; }
  .clog { display:flex; gap:12px; align-items:baseline; padding:7px 0 7px 16px; position:relative; }
  .clog:before { content:''; position:absolute; left:-5px; top:13px; width:8px; height:8px; border-radius:50%; background:var(--pc,var(--accent)); }
  .clog .cv { font-size:11px; font-weight:700; color:var(--pc,var(--accent)); min-width:42px; font-variant-numeric:tabular-nums; }
  .clog .ct { flex:1; min-width:0; font-size:13.5px; }
  .clog .cm, .proj-tasks .step .cm { color:var(--muted); font-size:11px; white-space:nowrap; }
  /* ===== Pixel-art skin (toggle) — this changes the STYLING only (mono font, square markers, blocky
     panels). Colour is the SIGNAL and stays vivid everywhere: menu markers, map zones,
     task/health/priority status. We never desaturate — colour gives the hint; the pixel styling just
     makes it read as a game console instead of distracting. ===== */
  :root[data-pixel="on"] { --pixfont:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Courier New",monospace; }
  /* pixel font on all labels / headings / cards / controls (NOT on article body prose) */
  :root[data-pixel="on"] #side, :root[data-pixel="on"] #brand b, :root[data-pixel="on"] #search, :root[data-pixel="on"] .cat, :root[data-pixel="on"] .item, :root[data-pixel="on"] #main h1, :root[data-pixel="on"] #main h2, :root[data-pixel="on"] #main h3, :root[data-pixel="on"] .meta, :root[data-pixel="on"] .chip, :root[data-pixel="on"] .lvchip, :root[data-pixel="on"] .bhead, :root[data-pixel="on"] .bcard, :root[data-pixel="on"] .btag, :root[data-pixel="on"] .bcount, :root[data-pixel="on"] .bsub, :root[data-pixel="on"] .step, :root[data-pixel="on"] .plan h3, :root[data-pixel="on"] .wl-head, :root[data-pixel="on"] .wl-item, :root[data-pixel="on"] .setrow .txt b, :root[data-pixel="on"] .setrow .txt small, :root[data-pixel="on"] .stat, :root[data-pixel="on"] .zrow, :root[data-pixel="on"] .st, :root[data-pixel="on"] .mbtn, :root[data-pixel="on"] .map-bar, :root[data-pixel="on"] #toast, :root[data-pixel="on"] .backlinks h4, :root[data-pixel="on"] .proj-card, :root[data-pixel="on"] .proj-ver, :root[data-pixel="on"] .pchip, :root[data-pixel="on"] .clog, :root[data-pixel="on"] .proj-sec > h2, :root[data-pixel="on"] .proj-link{ font-family:var(--pixfont); }
  :root[data-pixel="on"] #brand b, :root[data-pixel="on"] .cat, :root[data-pixel="on"] .bhead, :root[data-pixel="on"] .wl-head{ text-transform:uppercase; letter-spacing:.09em; }
  :root[data-pixel="on"] #main h1, :root[data-pixel="on"] #main h2, :root[data-pixel="on"] #main h3 { letter-spacing:.01em; }
  /* round → square everywhere (colored squares instead of dots/rings) */
  :root[data-pixel="on"] .dot, :root[data-pixel="on"] .bdot, :root[data-pixel="on"] .bsub .sdot, :root[data-pixel="on"] .step .num, :root[data-pixel="on"] .setrow .ico, :root[data-pixel="on"] ::-webkit-scrollbar-thumb, :root[data-pixel="on"] .clog:before{ border-radius:0 !important; }
  /* blockier panels & controls */
  :root[data-pixel="on"] .item { border-radius:2px; }
  :root[data-pixel="on"] .item.active { background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent); }
  :root[data-pixel="on"] #search, :root[data-pixel="on"] .chip, :root[data-pixel="on"] .btag, :root[data-pixel="on"] .bcard, :root[data-pixel="on"] .bcol, :root[data-pixel="on"] .stat, :root[data-pixel="on"] .setcard, :root[data-pixel="on"] .step, :root[data-pixel="on"] .mbtn, :root[data-pixel="on"] .wl-item, :root[data-pixel="on"] #toast, :root[data-pixel="on"] .st, :root[data-pixel="on"] #side-toggle, :root[data-pixel="on"] #side-open, :root[data-pixel="on"] #pixel-toggle, :root[data-pixel="on"] .proj-card, :root[data-pixel="on"] .proj-ver, :root[data-pixel="on"] .pchip, :root[data-pixel="on"] .proj-link{ border-radius:3px; }
  #pixel-toggle.on { color:var(--accent); border-color:var(--accent); }

  /* ========================================================================
     Pixel-art skin v2 — one cohesive retro-console look across EVERY board.
     Layered on top of the skin above. Colour stays the SIGNAL; this adds
     hard-edged "sticker" shadows, a faint graph-paper grid + scanline,
     segmented pixel meters and tactile button presses so the whole app reads
     as a single hand-made game UI instead of a set of unrelated dashboards.
     ======================================================================== */
  :root[data-pixel="on"]{
    --pix-sh:rgba(23,26,33,.22);     /* hard offset shadow (light theme) */
    --pix-grid:rgba(23,26,33,.05);   /* graph-paper grid */
    --pix-scan:rgba(23,26,33,.03);   /* scanline */
    --pix-edge:rgba(23,26,33,.14);   /* chunky inner edge */
  }
  @media (prefers-color-scheme:dark){
    :root[data-pixel="on"]{
      --pix-sh:rgba(0,0,0,.62); --pix-grid:rgba(255,255,255,.05);
      --pix-scan:rgba(255,255,255,.028); --pix-edge:rgba(255,255,255,.12);
    }
  }
  /* graph-paper + scanline texture behind the working area */
  :root[data-pixel="on"] #main{
    background-image:
      repeating-linear-gradient(0deg,var(--pix-scan) 0 1px,transparent 1px 3px),
      linear-gradient(var(--pix-grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--pix-grid) 1px,transparent 1px);
    background-size:100% 3px,24px 24px,24px 24px;
  }
    :root[data-pixel="on"] #brand b{ text-shadow:1px 1px 0 var(--pix-sh); }   /* retro title */
  /* hard "sticker" shadows on every card surface — the core of the look */
  :root[data-pixel="on"] .bcard, :root[data-pixel="on"] .bcol, :root[data-pixel="on"] .proj-card, :root[data-pixel="on"] .setcard, :root[data-pixel="on"] .stat{
    box-shadow:var(--pix-sh);
  }
  /* tactile hover-lift */
  :root[data-pixel="on"] .bcard:hover, :root[data-pixel="on"] .proj-card:hover, :root[data-pixel="on"] .setcard:hover{
    transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--pix-sh);
  }
  /* buttons + legend chips get a small hard shadow and a real press state */
  :root[data-pixel="on"] #side-toggle, :root[data-pixel="on"] #side-open, :root[data-pixel="on"] #pixel-toggle, :root[data-pixel="on"] .mbtn, :root[data-pixel="on"] .mdd-btn{ box-shadow:2px 2px 0 var(--pix-sh); }
  :root[data-pixel="on"] .mdd-btn, :root[data-pixel="on"] .mdd-panel,
  :root[data-pixel="on"] .mdd-item{ border-radius:0; }
  :root[data-pixel="on"] .mdd-panel{ box-shadow:3px 3px 0 var(--pix-sh); }
  :root[data-pixel="on"] #side-toggle:active, :root[data-pixel="on"] #side-open:active,
  :root[data-pixel="on"] #pixel-toggle:active, :root[data-pixel="on"] .mbtn:active{
    transform:translate(2px,2px); box-shadow:none;
  }
  :root[data-pixel="on"] .chip, :root[data-pixel="on"] .pchip, :root[data-pixel="on"] .btag{ box-shadow:1.5px 1.5px 0 var(--pix-sh); }
  /* sidebar selection reads like a highlighted menu row */
  :root[data-pixel="on"] .item.active{ box-shadow:inset 0 0 0 2px var(--accent); }
  /* segmented pixel meters (kanban progress bars) — fill keeps its colour */
  :root[data-pixel="on"] .bprog .bar{
    border-radius:0; box-shadow:inset 0 0 0 1px var(--pix-edge); }
  :root[data-pixel="on"] .bprog .bar i{
    border-radius:0;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
            mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
  }
  :root[data-pixel="on"] .dot, :root[data-pixel="on"] .bdot{ image-rendering:pixelated; }

  /* ========================================================================
     Pixel-art skin v3 — the retro-console identity layer (on top of v2).
     Real bitmap display font (Press Start 2P, OFL, embedded ~11KB woff2),

  :root[data-pixel="on"]{ --pixdisp:'PixelUI','SFMono-Regular',ui-monospace,Menlo,monospace;
    --pix-vig:rgba(23,26,33,.06); }
  @media (prefers-color-scheme:dark){ :root[data-pixel="on"]{ --pix-vig:rgba(0,0,0,.20); } }

  /* full-screen CRT — scanlines + soft vignette over the whole app (subtle) */
  :root[data-pixel="on"] body::after{ content:''; position:fixed; inset:0; z-index:80; pointer-events:none;
    background:repeating-linear-gradient(0deg,var(--pix-scan) 0 1px,transparent 1px 3px),
               radial-gradient(130% 115% at 50% 40%,transparent 62%,var(--pix-vig) 100%); }
  /* main keeps the graph-paper grid only (scanlines are global now) */
  :root[data-pixel="on"] #main{
    background-image:linear-gradient(var(--pix-grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--pix-grid) 1px,transparent 1px);
    background-size:24px 24px,24px 24px; }

  /* ── display font: brand, dashboard titles, column/section heads, buttons, badges ── */
  :root[data-pixel="on"] #brand b{ font-family:var(--pixdisp); font-size:10px; line-height:1.8;
    letter-spacing:.02em; text-shadow:2px 2px 0 var(--pix-sh); }
  :root[data-pixel="on"] #brand b::after{ content:'▮'; margin-left:6px; color:var(--accent);
    animation:pixblink 1.4s steps(1) infinite; }
  @keyframes pixblink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion:reduce){ :root[data-pixel="on"] #brand b::after{ animation:none; } }
  :root[data-pixel="on"] #main h1:has(.dot){ font-family:var(--pixdisp); font-size:16px; line-height:1.9;
    letter-spacing:0; text-transform:uppercase; padding-bottom:14px; text-shadow:2px 2px 0 var(--pix-sh);
    background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 16px) 0 100% / 100% 3px no-repeat; }

  :root[data-pixel="on"] .cat{ font-family:var(--pixdisp); font-size:8px; line-height:1.9; letter-spacing:.05em; }
  :root[data-pixel="on"] .bhead, :root[data-pixel="on"] .wl-head{ font-family:var(--pixdisp); font-size:8px; letter-spacing:.05em; }
  :root[data-pixel="on"] .mbtn{ font-family:var(--pixdisp); font-size:8px;
    text-transform:uppercase; letter-spacing:.03em; padding-top:8px; padding-bottom:7px; }
  :root[data-pixel="on"] .bcount, :root[data-pixel="on"] .proj-ver{ font-family:var(--pixdisp);
    font-size:7.5px; line-height:2; letter-spacing:.02em; }

  /* ── notched 8-bit corners + hard drop shadow on the hero panels ──
     clip-path clips box-shadow, so the shadow rides along as drop-shadow(),
     which follows the notched silhouette. Inner cards stay square+sticker. */
  :root[data-pixel="on"] .bcol, :root[data-pixel="on"] .setcard, :root[data-pixel="on"] .stat, :root[data-pixel="on"] .proj-card, :root[data-pixel="on"] .waitlane{
    clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,
      100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,
      6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));
    border-radius:0; box-shadow:none; filter:drop-shadow(3px 3px 0 var(--pix-sh)); }
  :root[data-pixel="on"] .proj-card:hover, :root[data-pixel="on"] .setcard:hover{
    transform:translate(-1px,-1px); box-shadow:none; filter:drop-shadow(4px 4px 0 var(--pix-sh)); }
  :root[data-pixel="on"] .bcard, :root[data-pixel="on"] .wl-item, :root[data-pixel="on"] .bsub{ border-radius:0; }

  /* ── game-menu sidebar: square rows, dashed hover frame, hard active frame ── */
  :root[data-pixel="on"] .item{ border-radius:0; }
  :root[data-pixel="on"] .item:hover{ box-shadow:inset 0 0 0 1px var(--pix-edge); }
  :root[data-pixel="on"] #search{ border-radius:0; box-shadow:2px 2px 0 var(--pix-sh); }
  :root[data-pixel="on"] #search:focus{ box-shadow:2px 2px 0 var(--pix-sh),0 0 0 3px var(--accent-soft); }
  /* assignee dropdown follows the skin: sticker panel, square search + rows, inset active frame */
  :root[data-pixel="on"] .bdrop-panel{ border-radius:3px; box-shadow:4px 4px 0 var(--pix-sh); }
  :root[data-pixel="on"] .bdrop-search{ border-radius:0; font-family:var(--pixfont); box-shadow:2px 2px 0 var(--pix-sh); }
  :root[data-pixel="on"] .bdrop-search:focus{ box-shadow:2px 2px 0 var(--pix-sh),0 0 0 3px var(--accent-soft); }
  :root[data-pixel="on"] .bdrop-list button{ border-radius:2px; font-family:var(--pixfont); }
  :root[data-pixel="on"] .bdrop-list button:hover{ box-shadow:inset 0 0 0 1px var(--pix-edge); }
  :root[data-pixel="on"] .bdrop-list button.on{ box-shadow:inset 0 0 0 1.5px var(--accent); }

  /* square switches (Settings), square avatars, square toast */
  :root[data-pixel="on"] .sw, :root[data-pixel="on"] .sw i, :root[data-pixel="on"] #toast{ border-radius:0; }

  /* inverse-video selection — the little things that sell the console feel */
  :root[data-pixel="on"] ::selection{ background:var(--accent); color:var(--bg); }

  /* ========================================================================
     Pixel-art skin v4 — detail polish: Settings zone meters and
     repo-version chips. Same contract as v2/v3: colour stays the signal,
     only the form goes blocky.
     ======================================================================== */
  /* segmented pixel meters: Settings zone bars */
  :root[data-pixel="on"] .zrow .zbar{
    border-radius:0; height:9px; box-shadow:inset 0 0 0 1px var(--pix-edge); }
  :root[data-pixel="on"] .zrow .zbar i{
    border-radius:0;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
            mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px); }
  :root[data-pixel="on"] .zrow .zn{ font-family:var(--pixdisp); font-size:8px; }

  /* ========================================================================
     Chat view — the only view that writes. It fills the pane like the board
     does, because a conversation with a scrollbar of its own reads better
     than one that pushes the page.
     ======================================================================== */
  #main.chat-mode{ padding:0; overflow:hidden; }
  #main.chat-mode .wrap{ max-width:none; padding:0; height:100%; }
  .chat{ display:flex; height:100%; }
  .chat-side{ width:236px; flex-shrink:0; border-right:1px solid var(--line); background:var(--panel);
              display:flex; flex-direction:column; }
  /* On a narrow window the base tree already takes a column — the channel list turns into a
     single scrollable strip rather than squeezing the conversation to nothing. */
  @media (max-width:900px){
    .chat-side{ width:64px; }
    .chat-side h3{ display:none; }
    .chan .nm{ display:none; }
    .chan{ justify-content:center; padding:8px 4px; }
  }
  .chat-side h3{ margin:0; padding:16px 16px 10px; font-size:11px; letter-spacing:.08em;
                 text-transform:uppercase; color:var(--muted); }
  .chat-chan{ overflow:auto; padding:0 8px 12px; }
  .chan{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:9px;
         cursor:pointer; color:var(--ink); }
  .chan:hover{ background:var(--chip); }
  .chan.on{ background:var(--accent-soft); }
  .chan .av{ width:24px; height:24px; border-radius:7px; flex-shrink:0; display:grid;
             place-items:center; font-size:10px; font-weight:700; color:#fff; background:var(--accent); }
  .chan .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .chan .nm b{ font-weight:600; }
  .chan .badge{ font-size:10px; color:var(--muted); }
  .chat-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .chat-head{ padding:13px 20px; border-bottom:1px solid var(--line); display:flex;
              align-items:center; gap:10px; background:var(--glass); backdrop-filter:blur(8px); }
  .chat-head b{ font-size:15px; }
  .chat-head small{ color:var(--muted); font-size:12px; flex:1; min-width:0;
                    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-head button{ border:1px solid var(--line); background:transparent; color:var(--muted);
                     border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .chat-head button:hover{ color:var(--ink); background:var(--chip); }
  .chat-log{ flex:1; overflow:auto; padding:20px 20px 8px; display:flex; flex-direction:column; gap:14px; }
  .msg{ display:flex; gap:11px; align-items:flex-start; max-width:860px; }
  .msg .av{ width:28px; height:28px; border-radius:8px; flex-shrink:0; display:grid; place-items:center;
            font-size:11px; font-weight:700; color:#fff; background:var(--muted); }
  .msg.me .av{ background:var(--ink); }
  .msg .bd{ min-width:0; flex:1; }
  .msg .who{ font-size:12px; color:var(--muted); margin-bottom:3px; }
  .msg .tx{ background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:10px 13px; box-shadow:var(--shadow-sm); overflow-wrap:anywhere; }
  .msg.me .tx{ background:var(--accent-soft); border-color:transparent; }
  .msg .tx pre{ margin:8px 0 0; padding:10px; background:var(--chip); border-radius:8px;
                overflow:auto; font-size:12.5px; }
  .msg .tx code{ background:var(--chip); border-radius:4px; padding:1px 4px; font-size:12.5px; }
  .msg.err .tx{ border-color:var(--danger); color:var(--danger); }
  .tools{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .tools span{ font-size:10.5px; color:var(--muted); background:var(--chip);
               border-radius:20px; padding:2px 8px; }
  .typing{ color:var(--muted); font-size:12.5px; padding:0 20px 10px; }
  .typing i{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--muted);
             margin-right:3px; animation:blip 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes blip{ 0%,60%,100%{ opacity:.25 } 30%{ opacity:1 } }
  .chat-form{ border-top:1px solid var(--line); padding:12px 20px 16px; background:var(--panel); }
  .chat-form textarea{ width:100%; resize:none; border:1px solid var(--line); border-radius:12px;
    background:var(--bg); color:var(--ink); padding:11px 13px; font:inherit; font-size:14px;
    min-height:52px; max-height:200px; }
  .chat-form textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .chat-form .row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .chat-form .hint{ flex:1; color:var(--muted); font-size:11.5px; }
  .chat-form button{ border:none; background:var(--accent); color:#fff; border-radius:9px;
                     padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .chat-form button[disabled]{ opacity:.45; cursor:default; }
  .chat-off{ margin:auto; max-width:560px; padding:40px 24px; }
  .chat-off code{ background:var(--chip); border-radius:5px; padding:2px 6px; }
  .chat-head .chip.cwd{ font-size:11px; max-width:340px; overflow:hidden; text-overflow:ellipsis;
                        white-space:nowrap; }
  /* folder picker — the folders Claude Code already knows, one click each */
  .pick-back{ position:fixed; inset:0; z-index:90; background:rgba(15,18,25,.5);
              display:grid; place-items:center; padding:24px; }
  .pick{ width:min(560px,100%); max-height:80vh; overflow:auto; background:var(--panel);
         border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-md); padding:22px; }
  .pick h3{ margin:0 0 6px; font-size:16px; }
  .pick p{ margin:0 0 14px; color:var(--muted); font-size:13px; }
  .pick-list{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .pk{ display:flex; flex-direction:column; gap:2px; text-align:left; border:1px solid var(--line);
       background:transparent; color:var(--ink); border-radius:10px; padding:9px 12px;
       font:inherit; cursor:pointer; }
  .pk:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .pk b{ font-size:13.5px; font-weight:600; }
  .pk span{ font-size:11.5px; color:var(--muted); }
  .pick-none{ font-style:italic; }
  .pick-own{ display:flex; gap:8px; }
  .pick-own input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px;
                   background:var(--bg); color:var(--ink); padding:9px 12px; font:inherit; font-size:13px; }
  .pick-own input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .pick-own button{ border:none; background:var(--accent); color:#fff; border-radius:10px;
                    padding:9px 16px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .pick-x{ margin-top:12px; border:none; background:transparent; color:var(--muted);
           font:inherit; font-size:12.5px; cursor:pointer; padding:4px 0; }
  .pick-x:hover{ color:var(--ink); }
  :root[data-pixel="on"] .pick, :root[data-pixel="on"] .pk, :root[data-pixel="on"] .pick-own input,
  :root[data-pixel="on"] .pick-own button{ border-radius:0; }
  :root[data-pixel="on"] .pick{ box-shadow:6px 6px 0 var(--pix-sh); }
  :root[data-pixel="on"] .pick h3{ font-family:var(--pixdisp); font-size:11px; line-height:2; }

  .chat-status{ border-top:1px solid var(--line); padding:9px 12px; display:flex; flex-wrap:wrap;
                gap:5px; font-size:10.5px; color:var(--muted); }
  .chat-status span{ background:var(--chip); border-radius:20px; padding:2px 8px; }
  .chat-status .warn{ color:var(--warn); }
  @media (max-width:900px){ .chat-status{ display:none; } }
  :root[data-pixel="on"] .chat-status span{ border-radius:0; font-family:var(--pixfont); }
  .chan-new{ width:100%; margin:6px 0 0; border:1px dashed var(--line); background:transparent;
             color:var(--muted); border-radius:9px; padding:8px; font:inherit; font-size:12.5px; cursor:pointer; }
  .chan-new:hover{ color:var(--accent); border-color:var(--accent); }
  .chat-form .ghost{ background:transparent; color:var(--muted); border:1px solid var(--line);
                     padding:7px 11px; font-weight:700; }
  .chat-form .ghost:hover{ color:var(--accent); border-color:var(--accent); }
  /* summon list — the roster, one keystroke away, in every room */
  .summon{ margin-bottom:8px; border:1px solid var(--line); border-radius:11px; background:var(--panel);
           box-shadow:var(--shadow-md); max-height:212px; overflow:auto; }
  .summon .sm{ display:flex; gap:9px; align-items:baseline; width:100%; text-align:left;
               border:none; background:transparent; color:var(--ink); padding:8px 12px;
               font:inherit; font-size:13px; cursor:pointer; }
  .summon .sm:hover, .summon .sm.on{ background:var(--accent-soft); }
  .summon .sm b{ color:var(--accent); }
  .summon .sm span{ color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── pixel-art skin: the chat as a console terminal ─────────────────────── */
  :root[data-pixel="on"] .chan, :root[data-pixel="on"] .chan .av, :root[data-pixel="on"] .msg .av,
  :root[data-pixel="on"] .msg .tx, :root[data-pixel="on"] .chat-form textarea,
  :root[data-pixel="on"] .chat-form button, :root[data-pixel="on"] .tools span,
  :root[data-pixel="on"] .chan-new, :root[data-pixel="on"] .summon,
  :root[data-pixel="on"] .msg .tx pre, :root[data-pixel="on"] .chat-head .chip.cwd{ border-radius:0; }
  :root[data-pixel="on"] .chat-side h3, :root[data-pixel="on"] .chat-head b,
  :root[data-pixel="on"] .chat-form button, :root[data-pixel="on"] .chan-new,
  :root[data-pixel="on"] .typing{ font-family:var(--pixdisp); }
  :root[data-pixel="on"] .chat-side h3{ font-size:7px; line-height:2.2; padding:16px 12px 8px; }
  :root[data-pixel="on"] .chat-head b{ font-size:11px; line-height:1.9; text-transform:uppercase;
    text-shadow:2px 2px 0 var(--pix-sh); }
  :root[data-pixel="on"] .chat-form button{ font-size:8px; line-height:2.2; padding:9px 14px;
    box-shadow:3px 3px 0 var(--pix-sh); }
  :root[data-pixel="on"] .chat-form button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--pix-sh); }
  :root[data-pixel="on"] .chan-new{ font-size:7px; line-height:2.4; }
  :root[data-pixel="on"] .typing{ font-size:7px; line-height:2.4; }
  :root[data-pixel="on"] .chan .nm, :root[data-pixel="on"] .msg .who,
  :root[data-pixel="on"] .msg .tx, :root[data-pixel="on"] .tools span,
  :root[data-pixel="on"] .chat-form textarea, :root[data-pixel="on"] .chat-form .hint,
  :root[data-pixel="on"] .summon .sm{ font-family:var(--pixfont); }
  /* avatars become 8-bit stickers: hard edge, hard shadow, no anti-aliased curve anywhere */
  :root[data-pixel="on"] .chan .av, :root[data-pixel="on"] .msg .av{
    font-family:var(--pixdisp); font-size:7px; box-shadow:2px 2px 0 var(--pix-sh);
    image-rendering:pixelated; }
  :root[data-pixel="on"] .msg .tx{ box-shadow:3px 3px 0 var(--pix-sh);
    box-shadow:3px 3px 0 var(--pix-sh), inset 0 0 0 1px var(--pix-edge); }
  :root[data-pixel="on"] .msg.me .tx{ box-shadow:3px 3px 0 var(--pix-sh); }
  :root[data-pixel="on"] .chan.on{ box-shadow:inset 0 0 0 2px var(--accent); }
  :root[data-pixel="on"] .chan:hover{ box-shadow:inset 0 0 0 1.5px var(--pix-edge); }
  :root[data-pixel="on"] .summon{ box-shadow:4px 4px 0 var(--pix-sh); }
  :root[data-pixel="on"] .summon .sm.on{ box-shadow:inset 0 0 0 1.5px var(--accent); }
  :root[data-pixel="on"] .chat-form textarea{ box-shadow:inset 2px 2px 0 var(--pix-edge); }
  :root[data-pixel="on"] .chat-form textarea:focus{ box-shadow:inset 2px 2px 0 var(--pix-edge),0 0 0 3px var(--accent-soft); }
  /* the log gets the console's own grid; the composer sits on a solid panel like a status bar */
  :root[data-pixel="on"] .chat-log{
    background-image:linear-gradient(var(--pix-grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--pix-grid) 1px,transparent 1px);
    background-size:24px 24px,24px 24px; }
  :root[data-pixel="on"] .typing i{ border-radius:0; width:6px; height:6px; }
  /* a blinking block after the last answer — the machine is waiting for you */
  :root[data-pixel="on"] .msg:last-child:not(.me) .tx::after{ content:'▮'; color:var(--accent);
    margin-left:4px; animation:pixblink 1.4s steps(1) infinite; }
  :root[data-pixel="on"] .chat-form .hint::before{ content:'> '; color:var(--accent); }

</style>
</head>
<body>
  <nav id="side">
    <div id="brand"><div><b id="co-name">Knowledge base</b><span id="co-meta"></span></div><button id="pixel-toggle" title="Pixel-art mode">▦</button><button id="side-toggle" title="Hide panel">⟨</button></div>
    <input id="search" placeholder="Search… (title, summary, tag, alias, entity)">
    <div id="tree"></div>
  </nav>
  <button id="side-open" title="Show panel">☰</button>
  <main id="main"><div class="wrap" id="content"><div id="empty">Pick an article from the list ←</div></div></main>

<script>
(function () {
  const D = window.KB_DATA || { articles: [], company: {}, briefs: [] };
  D.briefs = D.briefs || [];
  const bySlug = Object.fromEntries(D.articles.map(a => [a.slug, a]));
  const zoneLabel = z => (D.zoneLabels || {})[z] || z;
  const initials = s => String(s || '').split(/[-_. ]+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
  const assigneeTags = arr => (arr || []).map(p =>
    '<span class="btag av" title="' + escapeHtml(p) + '">👤 ' + escapeHtml(initials(p)) + '</span>').join('');
  const childrenOf = slug => D.articles.filter(x => x.parent === slug)
    .sort((a, b) => String(a.order || '99').localeCompare(String(b.order || '99'), undefined, { numeric: true })
      || String(a.due || '9999').localeCompare(String(b.due || '9999')));
  const byBrief = Object.fromEntries(D.briefs.map(b => [b.path, b]));
  document.getElementById('co-name').textContent = (D.company && D.company.name) || "Knowledge base";
  document.getElementById('co-meta').textContent =
    D.articles.length + ' articles · ' + (D.generatedAt || '').slice(0, 10);

  // Collapsible sidebar (state persists).
  function setSide(collapsed) {
    document.body.classList.toggle('side-collapsed', collapsed);
    try { localStorage.setItem('kbside', collapsed ? '1' : '0'); } catch { /* private mode — just don't remember */ }
  }
  document.getElementById('side-toggle').onclick = () => setSide(true);
  document.getElementById('side-open').onclick = () => setSide(false);
  try { if (localStorage.getItem('kbside') === '1') setSide(true); } catch { /* ignore */ }

  // Tiny toast (read-only hints).
  const toastEl = document.createElement('div'); toastEl.id = 'toast'; document.body.appendChild(toastEl);
  let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  const tree = document.getElementById('tree');
  function buildTree(filter) {
    tree.innerHTML = '';
    const f = (filter || '').toLowerCase();
    // Map — pinned near the top (whiteboard view of the whole base)
    if (!f && D.articles.length) {
      const nLinks = D.articles.reduce((s, a) => s + (a.links || []).length, 0);
      const el = document.createElement('div');
      el.className = 'item'; el.dataset.map = '1';
      el.innerHTML = '<div><span class="dot" style="background:var(--accent)"></span>Map</div><small>' + D.articles.length + ' nodes · ' + nLinks + ' links</small>';
      el.onclick = () => { location.hash = 'map'; };
      tree.appendChild(el);
    }
    // Task board — pinned right under the map
    const nTasks = D.articles.filter(a => a.path.split('/')[0] === 'tasks').length;
    if (nTasks && !f) {
      const open = D.articles.filter(a => a.path.split('/')[0] === 'tasks' && a.status !== 'done').length;
      const el = document.createElement('div');
      el.className = 'item'; el.dataset.board = '1';
      el.innerHTML = '<div><span class="dot" style="background:var(--warn)"></span>Task board</div><small>' + open + ' open · ' + (nTasks - open) + ' done</small>';
      el.onclick = () => { location.hash = 'board'; };
      tree.appendChild(el);
    }
    // Projects — pinned view (list → per-project detail: task history, version)
    if (!f && D.articles.some(a => a.path.split('/')[0] === 'projects')) {
      const nP = D.articles.filter(a => a.path.split('/')[0] === 'projects').length;
      const el = document.createElement('div');
      el.className = 'item'; el.dataset.projects = '1';
      el.innerHTML = '<div><span class="dot" style="background:' + zoneColor('projects') + '"></span>Projects</div><small>' + nP + ' projects · versions &amp; history</small>';
      el.onclick = () => { location.hash = 'projects'; };
      tree.appendChild(el);
    }
    // Chat — pinned; the one view that talks back (needs ./kb chat running)
    if (!f) {
      const live = !!window.KB_CHAT;
      const el = document.createElement('div');
      el.className = 'item'; el.dataset.chat = '1';
      const n = chatState.channels.length;
      el.innerHTML = '<div><span class="dot" style="background:' + (live ? 'var(--ok)' : 'var(--muted)') + '"></span>Chat</div>'
        + '<small>' + (live ? (n ? n + ' channels · live' : 'live · assistants & projects') : 'offline · run ./kb chat') + '</small>';
      el.onclick = () => { location.hash = 'chat'; };
      tree.appendChild(el);
    }
    // Recently updated — only in the unfiltered view
    if (!f) {
      const recent = D.articles.filter(a => a.updated)
        .sort((x, y) => (y.updated || '').localeCompare(x.updated || '')).slice(0, 5);
      if (recent.length) {
        const h = document.createElement('div'); h.className = 'cat'; h.textContent = 'Recently updated'; tree.appendChild(h);
        for (const a of recent) {
          const el = document.createElement('div');
          el.className = 'item'; el.dataset.slug = a.slug;
          el.innerHTML = '<div>' + escapeHtml(a.title) + '</div><small>' + escapeHtml(a.updated) + '</small>';
          el.onclick = () => { location.hash = a.slug; };
          tree.appendChild(el);
        }
      }
    }
    const groups = {};
    for (const a of D.articles) {
      const hay = (a.title + ' ' + a.summary + ' ' + (a.author || '') + ' ' + a.status + ' ' + (a.tags || []).join(' ') + ' ' + (a.aka || []).join(' ') + ' ' + (a.entities || []).join(' ')).toLowerCase();
      if (f && !hay.includes(f)) continue;
      (groups[a.path.split('/')[0]] ??= []).push(a);
    }
    for (const cat of Object.keys(groups).sort()) {
      const h = document.createElement('div'); h.className = 'cat';
      h.innerHTML = '<span class="dot" style="background:' + zoneColor(cat) + '"></span>' + escapeHtml(zoneLabel(cat));
      tree.appendChild(h);
      for (const a of groups[cat].sort((x, y) => x.title.localeCompare(y.title))) {
        const el = document.createElement('div');

  const ZONE_STYLE = {

    skills:     { c:'#e0653a', s:'star',     g:'✦' },

  const SHAPE_CYCLE = ['circle', 'hex', 'star', 'triangle', 'diamond', 'square', 'pent', 'ring'];
  function zoneStyle(z) {
    if (ZONE_STYLE[z]) return ZONE_STYLE[z];
    let h = 0; for (const ch of z) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return { c: 'hsl(' + (h % 360) + ',55%,55%)', s: SHAPE_CYCLE[h % SHAPE_CYCLE.length],
             g: { circle:'●', hex:'⬢', star:'✦', triangle:'▲', diamond:'◆', square:'■', pent:'⬟', ring:'◎' }[SHAPE_CYCLE[h % SHAPE_CYCLE.length]] };

  function drawShape(ctx, shape, x, y, r) {
    ctx.beginPath();

    } else if (shape === 'ring') {
      ctx.arc(x, y, r, 0, 7); ctx.arc(x, y, r * 0.45, 0, 7, true);
    } else if (shape === 'star') {
      for (let i = 0; i < 8; i++) {
        const rr = i % 2 === 0 ? r * 1.15 : r * 0.42;
        const a = i / 8 * Math.PI * 2 - Math.PI / 2;
        ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
    } else {
      const sides = { triangle: 3, diamond: 4, pent: 5, hex: 6 }[shape] || 6;
      const rot = shape === 'diamond' ? 0 : -Math.PI / 2;
      for (let i = 0; i < sides; i++) {
        const a = i / sides * Math.PI * 2 + rot;
        ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r * 1.08, y + Math.sin(a) * r * 1.08);
      }

    ctx.closePath(); ctx.fill();
  }

      const z1 = byId[a.slug].zone, z2 = byId[a.project].zone;
      if (z1 !== z2) { const zk = z1 < z2 ? z1 + '|' + z2 : z2 + '|' + z1; zonePair[zk] = (zonePair[zk] || 0) + 1; }

    // Label density + colour mode (persisted). hubCut = degree at/above which a node counts
    // as a hub and gets a label in "hubs" mode.

    const hubCut = 4;
    const zoneNames = Object.keys(zones).sort((x, y) => zones[y].length - zones[x].length);

    // ── Cosmos layout (the layered second-brain view): center → SKILLS sparkle ring →

    const cosmos = { rings: [], labels: [], memR0: 0, memR1: 0, R: 0 };
    (function cosmosLayout() {
      const has = z => zones[z] && zones[z].length;
      const memZones = zoneNames.filter(z => !['skills', 'tasks', 'projects'].includes(z));
      let R = 90;

          let idx = 0, row = 0;

        ids.forEach((sl, i) => {

          const n = byId[sl]; n.cx = Math.cos(ang) * taskR; n.cy = Math.sin(ang) * taskR;
        });

        ids.forEach((sl, i) => {

    // ── Galaxy layout: deterministic community clusters (replaces the old force-sim that

    const galaxyClusters = [];
    let galaxyR = 400;

        byComm.get(c).push(n.slug);

      const commLabels = Object.fromEntries((D.communities || []).map(c => [c.id, c.label]));
      const commIds = [...byComm.keys()].filter(c => c >= 0).sort((a, b) => byComm.get(b).length - byComm.get(a).length || a - b);
      const ringR = 300 + Math.sqrt(nodes.length) * 34;   // spread clusters so centres don't crowd

      });

    })();
    // Positions: your saved arrangement first (whiteboard memory), else jitter around the anchor.
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch { saved = {}; }
    if (!saved || typeof saved !== 'object') saved = {};   // stale/foreign schema → clean start
    const finPair = p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]);

    if (['hubs', 'all', 'none'].includes(saved.labelMode)) labelMode = saved.labelMode;

    // Filter bar — dropdown facets instead of a chip wall. First dropdown follows the Colour

          + '<div class="mdd-panel">'

    // Theme colours + community palette — MUST be initialised before buildLegend() runs:

    function resize() {

    function orbitStep() {

        if (mode === 'cosmos') { tx = n.cx; ty = n.cy; }

    function grid() {

        const spread = 60 + Math.sqrt(zones[n.zone].length) * 16;
        n.x = A.x + (Math.random() - 0.5) * spread; n.y = A.y + (Math.random() - 0.5) * spread;
      }
      if (mode === 'galaxy') alpha = 1; else orbitMoving = true;
      needFrame = true;
      setTimeout(fitView, 700);   // let the layout breathe, then frame the result
    };

    mapStop = () => {
      cancelAnimationFrame(raf); ro.disconnect(); clearTimeout(persistT);
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('click', onDocClick);
      mq.removeEventListener('change', onScheme);
      main.classList.remove('map-mode');
    };
  }

  // ===== Projects (📁) — list + per-project detail (task history, version, links) =====
  const projInfo = (slug) => {
    const pt = D.articles.filter(a => a.path.split('/')[0] === 'tasks' && a.project === slug);
    const done = pt.filter(t => t.status === 'done');
    const open = pt.filter(t => t.status !== 'done' && t.status !== 'archived');
    return { pt, done, open };
  };
  const projActive = p => p.status === 'active' || (p.tags || []).includes('status-active');
  const escAttr = s => escapeHtml(String(s == null ? '' : s)).replace(/"/g, '&quot;');

  // Project version — real repo versioning when the project is mapped in repos.json
  // (reindex probes the local clone: latest git tag ≈ the GitHub release, the version
  // declared in package.json/plugin.json/CHANGELOG = the internal, not-yet-released one,
  // plus dirty/unpushed markers). Falls back to the internal task counter v1.<shipped>.
  const semNewer = (a, b) => {   // true when a > b, comparing dotted numbers
    const A = String(a).split('.').map(Number), B = String(b).split('.').map(Number);
    for (let i = 0; i < Math.max(A.length, B.length); i++) {
      const x = A[i] || 0, y = B[i] || 0;
      if (x !== y) return x > y;
    }
    return false;
  };
  const projVer = (p, doneCount) => {
    const V = p.ver;
    if (V && (V.internal || V.tag)) {
      const gh = V.tag ? String(V.tag).replace(/^v/i, '') : null;
      const int = V.internal ? String(V.internal).replace(/^v/i, '') : null;
      const intAhead = !!(int && (!gh || semNewer(int, gh)) && int !== gh);
      const cur = intAhead ? int : (gh || int);
      const dev = intAhead || !!V.dirty || (V.ahead | 0) > 0;   // work not (fully) on GitHub yet
      const bits = [gh ? 'GitHub release: v' + gh : 'no release tag yet'];
      if (intAhead) bits.push('internal: v' + int + ' (not released)');
      if ((V.ahead | 0) > 0) bits.push(V.ahead + ' commit' + (V.ahead > 1 ? 's' : '') + ' not pushed');
      if (V.dirty) bits.push('uncommitted changes');
      if (V.branch) bits.push('on ' + V.branch);
      return { label: 'v' + cur + (V.dirty ? '*' : ''), cls: dev ? ' dev' : '', title: bits.join(' · '), V, gh, int, intAhead };
    }
    return { label: 'v1.' + doneCount, cls: '', title: 'internal task versioning — +1 per shipped task', V: null };
  };

      + '<span>· version from the linked repo (amber = ahead of GitHub, * = uncommitted) or v1.N per shipped task · click a project for details</span></div><div class="proj-grid">';
    for (const p of sorted) {

        + '<div class="proj-top"><b>' + escapeHtml(p.title) + '</b><span class="proj-ver' + vi.cls + '" title="' + escAttr(vi.title) + '">' + escapeHtml(vi.label) + '</span></div>'
        + '<div class="proj-sum">' + escapeHtml(p.summary || '') + '</div><div class="proj-foot">'
        + (projActive(p) ? '<span class="st active">active</span>' : '<span class="st">' + escapeHtml(p.status || '') + '</span>')
        + (p.resource ? '<span class="pchip">🔗 link</span>' : '')
        + '<span class="pchip">✅ ' + I.done.length + ' · 🔨 ' + I.open.length + '</span>'
        + '</div></div>';
    }
    html += '</div></article>';
